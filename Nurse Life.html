<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nurse Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-screen canvas world, floating glass cards on the edges (RTL), sheets for menus */
:root{
  --ink:#26304a; --muted:#6a7392; --line:#dfe4f0; --panel:rgba(255,255,255,.93); --paper:#f6f7fb;
  --blue:#4f7fc0; --blue2:#3a64a6; --teal:#4a87a8; --pink:#ee8a9f; --peach:#f5c59a; --brown:#5a3d2e;
  --ok:#3a9a76; --warn:#d98f22; --bad:#d4566a; --bg:#d9e0ee;
  --f-ui:'Vazirmatn',Tahoma,'Segoe UI',sans-serif; --f-disp:'Fredoka','Vazirmatn',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--bg)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(38,48,74,.13);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tab{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#hud>*{pointer-events:auto}
#me{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 14px;min-width:0}
#face{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 20%;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue);background:#eee;flex:none;cursor:pointer}
.mewrap{display:grid;gap:4px;min-width:0}
.mename{display:flex;gap:6px;align-items:baseline;font-weight:800;font-size:15px;white-space:nowrap}
.mename small{font-weight:500;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:16px 1fr 30px;gap:6px;align-items:center;font-size:11px;color:var(--muted);width:170px}
.bar .ic{width:15px;height:15px}
.track{height:8px;border-radius:6px;background:#e7ebf4;overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .3s}
#xpf{background:linear-gradient(90deg,var(--peach),var(--pink))}
#enf{background:var(--teal)}
#mof{background:var(--blue)}
#clock{display:grid;justify-items:center;padding:6px 12px 8px;gap:2px}
#clock .day{font-size:11px;color:var(--muted);font-weight:500}
#clock .time{font:700 26px/1 var(--f-ui);letter-spacing:.5px}
.speeds{display:flex;gap:4px;direction:ltr}
.speeds button{border:0;background:#eef1f8;border-radius:10px;width:34px;height:28px;display:grid;place-items:center;color:var(--muted)}
.speeds button.on{background:var(--blue);color:#fff}
.speeds .ic{width:15px;height:15px}
#side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#tools{display:flex;gap:6px;padding:6px;align-items:center}
#floorLbl{font-weight:800;font-size:13px;padding:0 8px;white-space:nowrap;color:var(--blue2)}
.ibtn{border:0;background:#eef1f8;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;position:relative}
.ibtn:hover{background:#e2e8f5}
.ibtn .badge{position:absolute;top:-4px;left:-4px;background:var(--pink);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* tasks */
#tasks{position:fixed;z-index:4;right:calc(env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 96px);width:310px;max-height:calc(100% - 210px);display:flex;flex-direction:column;overflow:hidden}
#tasks header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-weight:800}
#tasks header button{border:0;background:none;color:var(--muted);padding:4px}
#tlist{overflow:auto;padding:0 8px 10px;display:grid;gap:4px;overscroll-behavior:contain}
.tsec{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;padding:8px 6px 2px}
.trow{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:12px;border:1px solid transparent;background:none;text-align:right;width:100%}
.trow:hover{background:#f0f3fa}
.trow.on{background:#eaf0fb;border-color:#c9d7f0}
.trow .tic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#eef2fa;color:var(--blue2)}
.trow.ev .tic{background:#fdecef;color:var(--bad)}
.trow.ms .tic{background:#fdf2e6;color:#c47a2a}
.trow .tt{font-size:13px;font-weight:700;line-height:1.35;min-width:0}
.trow .ts{font-size:11px;color:var(--muted);font-weight:500;display:block;margin-top:1px}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px;background:#eef1f8;color:var(--muted);white-space:nowrap}
.chip.soon{background:#fdf0dd;color:var(--warn)}
.chip.late{background:#fde5e9;color:var(--bad)}
.chip.ok{background:#e1f3ec;color:var(--ok)}
.trow.done{opacity:.55}
.trow.done .tt{text-decoration:line-through;text-decoration-color:rgba(38,48,74,.35)}

/* tracker + inventory */
#bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(560px,calc(100% - 20px));pointer-events:none}
#bottom>*{pointer-events:auto}
#tracker{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;width:100%;box-sizing:border-box}
#tracker .tic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--blue);color:#fff;flex:none}
#tracker .tx{flex:1;min-width:0}
#tracker .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tracker .tx span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{border:0;background:var(--pink);color:#fff;font-weight:800;border-radius:12px;padding:0 14px;height:38px;display:flex;align-items:center;gap:6px;flex:none;font-size:13px}
.go:hover{filter:brightness(1.05)}
#inv{display:flex;gap:6px;padding:6px;align-items:center}
.slot{width:46px;height:46px;border-radius:13px;background:#eef1f8;border:1.5px dashed #cdd5e6;display:grid;place-items:center;color:var(--blue2);position:relative;padding:0}
.slot.full{background:#fff;border:1.5px solid #c9d7f0}
.slot .ic{width:22px;height:22px}
.slot small{position:absolute;bottom:-1px;inset-inline:0;font-size:9px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
#hands{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--teal);padding:0 8px;white-space:nowrap}
#hands[hidden]{display:none!important}

/* action menu */
#amenu{position:fixed;z-index:8;min-width:230px;max-width:290px;padding:8px;display:grid;gap:3px}
#amenu h4{margin:2px 6px 6px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#amenu h4 small{font-weight:500;color:var(--muted);font-size:11px}
.aitem{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;border:0;background:none;border-radius:11px;padding:8px;text-align:right;font-size:13px;font-weight:600}
.aitem:hover:not(:disabled){background:#eef2fa}
.aitem .ic{color:var(--blue2);width:20px;height:20px}
.aitem em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.aitem:disabled{opacity:.55;cursor:default}
.aitem .why{display:block;font-size:11px;color:var(--bad);font-weight:500}

/* toasts */
#toasts{position:fixed;z-index:9;top:calc(env(safe-area-inset-top,0px) + 92px);left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(420px,90%)}
.toast{background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;animation:tin .25s ease-out}
.toast.good{background:#2f7f63}.toast.bad{background:#b9465a}.toast.ev{background:#c4732a}.toast.xp{background:var(--blue2)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(30,38,62,.38);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.sheet{background:var(--paper);border-radius:22px;box-shadow:0 20px 60px rgba(20,28,50,.3);width:min(520px,100%);max-height:100%;overflow:auto;padding:20px;box-sizing:border-box;position:relative}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .lead{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.7}
.x{position:absolute;top:12px;left:12px;border:0;background:#eceff7;border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;font-size:14px;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:#e9edf6;color:var(--ink)}
.btn.pink{background:var(--pink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.li .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef2fa;color:var(--blue2)}
.li b{font-size:14px}.li p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.floors{display:grid;gap:8px}
.floorbtn{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;text-align:right}
.floorbtn .num{width:38px;height:38px;border-radius:50%;background:#eef2fa;display:grid;place-items:center;font-weight:800;color:var(--blue2)}
.floorbtn.cur{opacity:.5;cursor:default}
.floorbtn.sug{border-color:var(--pink);box-shadow:0 0 0 2px #f9d3dc}
.floorbtn span{font-size:12px;color:var(--muted);font-weight:500;display:block}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--muted)}
.stars{display:flex;gap:4px;justify-content:center;color:#f0b44c;margin:6px 0}
.stars .ic{width:30px;height:30px;fill:currentColor;stroke:none}
.stars .off{color:#d8deea}
.mini{height:6px;border-radius:4px;background:#e7ebf4;overflow:hidden;width:90px}
.mini i{display:block;height:100%;background:var(--teal);border-radius:4px}
.prof{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
.prof img{width:120px;border-radius:16px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv span{color:var(--muted)}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;margin:0}
.help dt{font-weight:800}
.help dd{margin:0;color:var(--muted);line-height:1.7}
.credit{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
.credit b{color:var(--blue2)}

/* start screen */
#start{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 80% 10%,#f9dfe5 0,#e7ecf8 45%,#d6def0 100%);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto}
.hero{display:grid;grid-template-columns:auto auto;gap:28px;align-items:center;max-width:860px}
.hero .art{position:relative;width:250px}
.hero .art img{width:250px;border-radius:28px;box-shadow:0 20px 50px rgba(40,50,90,.22);display:block}
.hero .art .tag{position:absolute;bottom:-12px;right:16px;background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 6px 16px rgba(40,50,90,.15)}
.logo{font:700 64px/1 var(--f-disp);letter-spacing:-1px;color:var(--blue2);margin:0;direction:ltr;text-align:right}
.logo span{color:var(--pink)}
.sub{font-size:15px;color:var(--muted);margin:10px 0 22px;line-height:1.9;max-width:380px}
.menu{display:grid;gap:10px;max-width:300px}
.menu .btn{padding:14px 18px;font-size:15px}
.feat{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.feat span{font-size:11.5px;background:rgba(255,255,255,.7);border-radius:20px;padding:5px 10px;color:var(--muted);font-weight:600}
#start .credit{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0}
#fade{position:fixed;inset:0;z-index:15;background:#1f2740;opacity:0;pointer-events:none;transition:opacity .22s}
#fade.on{opacity:1}

@media (max-width:760px){
  #hud{flex-wrap:wrap}
  #me{padding:6px 10px;gap:8px;flex:1 1 auto}
  #face{width:44px;height:44px}
  .bar{width:auto;min-width:0;grid-template-columns:14px 1fr 26px}
  .mewrap{flex:1}
  #clock{padding:5px 8px 6px}
  #clock .time{font-size:21px}
  .speeds button{width:30px;height:26px}
  #side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 102px);left:calc(env(safe-area-inset-left,0px) + 10px);align-items:flex-start}
  #tools{flex-direction:column;padding:5px}
  #floorLbl{padding:2px 0;font-size:11px}
  .ibtn{width:38px;height:38px}
  #tasks{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);width:auto;max-height:62%;z-index:12}
  #toasts{top:calc(env(safe-area-inset-top,0px) + 104px);left:auto;right:calc(env(safe-area-inset-right,0px) + 10px);transform:none;width:calc(100% - 96px);justify-items:end}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:18px}
  .hero .art,.hero .art img{width:170px}
  .logo{font-size:46px;text-align:center}
  .sub{margin-inline:auto}
  .menu{margin-inline:auto;width:100%}
  .feat{justify-content:center}
  #start .credit{position:static;margin-top:20px}
  .prof{grid-template-columns:90px 1fr}.prof img{width:90px}
}
@media (max-width:420px){
  .bar{font-size:10px}
  .mename small{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}#fade{transition:none}}
</style>

<canvas id="game" aria-label="محیط بازی بیمارستان"></canvas>

<div id="hud" dir="rtl" hidden>
  <div id="me" class="card">
    <img id="face" alt="ماریا" title="پروفایل ماریا">
    <div class="mewrap">
      <div class="mename">ماریا <small id="lvl"></small></div>
      <div class="bar" title="تجربه"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z"/></svg><div class="track"><div id="xpf" class="fill"></div></div><span id="xpv" class="tab"></span></div>
      <div class="bar" title="انرژی"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><div class="track"><div id="enf" class="fill"></div></div><span id="env" class="tab"></span></div>
      <div class="bar" title="روحیه"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M8 14s1.5 2 4 2 4-2 4-2 M9 9.5h.01 M15 9.5h.01"/></svg><div class="track"><div id="mof" class="fill"></div></div><span id="mov" class="tab"></span></div>
    </div>
  </div>
  <div id="clock" class="card">
    <div class="day" id="dayLbl"></div>
    <div class="time tab" id="timeLbl"></div>
    <div class="speeds" id="speeds"></div>
  </div>
  <div id="side">
    <div id="tools" class="card">
      <div id="floorLbl"></div>
      <button class="ibtn" id="bTasks" title="کارها (T)"></button>
      <button class="ibtn" id="bSave" title="ذخیره"></button>
      <button class="ibtn" id="bMenu" title="منو (Esc)"></button>
    </div>
  </div>
</div>

<aside id="tasks" class="card" dir="rtl" hidden>
  <header><span>کارهای شیفت</span><button id="tClose" aria-label="بستن"></button></header>
  <div id="tlist"></div>
</aside>

<div id="bottom" dir="rtl" hidden>
  <div id="tracker" class="card"></div>
  <div id="inv" class="card"></div>
</div>

<div id="amenu" class="card" dir="rtl" hidden></div>
<div id="toasts" dir="rtl"></div>
<div id="modal" dir="rtl" hidden><div class="sheet" id="sheet"></div></div>
<div id="fade"></div>

<div id="start" dir="rtl">
  <div class="hero">
    <div class="art"><img id="startArt" alt="ماریا، پرستار بیمارستان"><div class="tag">ماریا · پرستار بخش</div></div>
    <div>
      <h1 class="logo">Nurse <span>Life</span></h1>
      <p class="sub">یک روز کامل در کفش‌های ماریا: بیماران را مراقبت کن، با همکاران کار کن، از انرژی و روحیه‌ات مراقبت کن و پرستار بهتری شو.</p>
      <div class="menu">
        <button class="btn pink" id="bContinue" hidden>ادامهٔ بازی</button>
        <button class="btn" id="bNew">بازی جدید</button>
        <button class="btn ghost" id="bHelp">راهنمای بازی</button>
      </div>
      <div class="feat"><span>۴ محیط و آسانسور</span><span>۱۹ نوع کار و مأموریت</span><span>رویدادهای تصادفی</span><span>ذخیرهٔ خودکار</span></div>
    </div>
  </div>
  <div class="credit">ساخته شده توسط <b>نئون‌لاین</b></div>

function interactNearest() {
  const f = FL[S.floor]; const [px, py] = tileOf(P.x, P.y); let best = null, bd = 9;

  for (const n of NPCS) if (n.floor === f.id && dist(n, P) < T * 1.7) consider({ kind: 'npc', o: n }, n.x, n.y);
  for (const g of S.guests) if (g.floor === f.id && dist(g, P) < T * 1.7) consider({ kind: 'guest', o: g }, g.x, g.y);
  for (const d of S.dyn) if (d.floor === f.id && reachRect(px, py, { x: d.x, y: d.y, w: 1, h: 1 })) consider({ kind: 'dyn', o: d }, (d.x + .5) * T, (d.y + .5) * T);

}

  openModal(`<div style="display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center"><img src="${IMG[good ? 'happy' : 'sad']}" alt="" style="width:96px;border-radius:20px"><div><h2>پایان شیفت روز ${fa(S.day)}</h2><p class="lead" style="margin:0">${handover ? 'شیفت به‌موقع به خانم احمدی تحویل داده شد.' : 'شیفت بدون تحویل رسمی تمام شد.'}</p></div></div>
  <div class="stars">${st}</div>
  <div class="stat"><div><b>${fa(S.ds.done)}</b><span>کار انجام‌شده</span></div><div><b>${fa(S.ds.failed)}</b><span>از دست رفته</span></div><div><b>+${fa(S.ds.xp)}</b><span>تجربه</span></div></div>
  <p class="lead">رضایت بیماران: ${fa(Math.round(comfort))} از ۱۰۰ · سطح ماریا: ${fa(S.level)} (${levelTitle(S.level)})</p>
  <button class="btn pink" id="nextDay" style="width:100%">رفتن به خانه و شروع روز ${fa(S.day + 1)}</button>`, { closable: false });
  $('#nextDay').onclick = () => { closeModal(); nextDay(); };
}
function helpHTML() {
  return `<div class="help"><h2>راهنمای Nurse Life</h2><p class="lead">ماریا پرستار بخش است. کارهای شیفت را قبل از موعد انجام بده، مراقب انرژی و روحیه‌اش باش و تجربه جمع کن.</p>
  <dl><dt>حرکت</dt><dd>روی زمین بزن تا ماریا برود، یا از کلیدهای جهت و WASD استفاده کن.</dd>
  <dt>تعامل</dt><dd>روی بیمار، همکار یا وسیله بزن تا منوی کارها باز شود. با کیبورد: E.</dd>
  <dt>هدف</dt><dd>کار انتخاب‌شده پایین صفحه است. «برو» ماریا را به قدم بعدی می‌برد، حتی بین طبقه‌ها.</dd>
  <dt>وسایل</dt><dd>دارو از داروخانهٔ طبقه ۲، سرم و پانسمان از انبار طبقه ۱، غذا از کافه‌تریای همکف. کیف ۴ جا دارد.</dd>
  <dt>بهداشت</dt><dd>شستن دست‌ها قبل از کار با بیمار ۲۵٪ تجربهٔ بیشتر می‌دهد.</dd>
  <dt>انرژی</dt><dd>قهوه، تنقلات، ناهار و کاناپهٔ اتاق استراحت. زیر ۲۰ ماریا کندتر می‌شود.</dd>
  <dt>روحیه</dt><dd>گپ با همکاران، حیاط، اتاق آرامش و کارهای موفق. روحیهٔ بالا تجربهٔ بیشتر می‌دهد.</dd>
  <dt>زمان</dt><dd>شیفت ۷ تا ۱۹ است. توقف و سرعت ۱ تا ۳ بالای صفحه است (Space، 1، 2، 3). T فهرست کارها، G رفتن به هدف.</dd>
  <dt>ذخیره</dt><dd>پیشرفت به‌طور خودکار در همین مرورگر ذخیره می‌شود.</dd></dl>
  <p class="credit">ساخته شده توسط <b>نئون‌لاین</b></p></div>`;
}
function menuModal() {
  openModal(`<h2>منو</h2><p class="lead">روز ${fa(S.day)} · ${hm(S.time)} · ${FL[S.floor].name}</p>
  <div class="list"><button class="btn" id="mResume">ادامه</button><button class="btn ghost" id="mSave">ذخیره</button><button class="btn ghost" id="mProf">پروفایل ماریا</button><button class="btn ghost" id="mHelp">راهنما</button><button class="btn ghost" id="mTitle">صفحهٔ اصلی</button></div>
  <p class="credit">Nurse Life · نسخهٔ اولیه<br>ساخته شده توسط <b>نئون‌لاین</b></p>`);
  $('#mResume').onclick = closeModal; $('#mSave').onclick = () => { saveGame(true, true); closeModal(); };
  $('#mProf').onclick = profileModal; $('#mHelp').onclick = () => openModal(helpHTML());
  $('#mTitle').onclick = () => { saveGame(true); closeModal(); showTitle(); };
}

// ============ save/load ============
function saveGame(silent, announce) {
  if (!S) return false;
  S.px = P.x; S.py = P.y; S.dir = P.dir;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); if (announce) toast('بازی ذخیره شد.', 'good'); return true; }
  catch (e) { if (announce) toast('ذخیره ممکن نشد؛ مرورگر اجازهٔ ذخیره نمی‌دهد.', 'bad'); return false; }
}
function loadSave() { try { const s = localStorage.getItem(SAVE_KEY); if (!s) return null; const o = JSON.parse(s); return o && o.v === 1 ? o : null; } catch (e) { return null; } }
function startGame(st) {
  S = st; P.x = S.px; P.y = S.py; P.dir = S.dir || 'd'; P.path = []; P.act = null; P.pending = null; P.trail = []; P.lastTile = tileOf(P.x, P.y).join(',');
  initNPCs(); running = true; camSnap = true; lastSpeed = S.speed || 1;
  $('#start').hidden = true; $('#hud').hidden = false; $('#bottom').hidden = false;
  toggleTasks(innerWidth > 1100);
  renderSpeeds(); renderInv(); updateHUD(true);
}
function showTitle() {
  running = false; $('#start').hidden = false; $('#hud').hidden = true; $('#bottom').hidden = true; $('#tasks').hidden = true; closeMenu();
  $('#bContinue').hidden = !loadSave();
  const s = loadSave(); if (s) $('#bContinue').textContent = `ادامهٔ بازی · روز ${fa(s.day)}`;
}
$('#bNew').onclick = () => {
  const had = loadSave();
  const go = () => { const st = newState(); addTaskTo(st); startGame(st); saveGame(true); openModal(helpHTML() + `<button class="btn pink" id="hgo" style="width:100%;margin-top:14px">شروع شیفت</button>`, { onClose: () => toast('سلام ماریا! اول در رختکن کارت ورود بزن.', 'xp') }); $('#hgo').onclick = closeModal; };
  if (had) {
    openModal(`<h2>بازی جدید؟</h2><p class="lead">پیشرفت ذخیره‌شده (روز ${fa(had.day)}) پاک می‌شود.</p><div class="row"><button class="btn pink" id="cy">بله، از نو</button><button class="btn ghost" id="cn">نه</button></div>`);
    $('#cy').onclick = () => { closeModal(); go(); }; $('#cn').onclick = closeModal;
  } else go();
};
function addTaskTo(st) { const prev = S; S = st; addTask({ kind: 'clockin', start: 0, due: 7 * 60 + 30 }); S = prev; }
$('#bContinue').onclick = () => { const s = loadSave(); if (s) startGame(s); };
$('#bHelp').onclick = () => openModal(helpHTML());
$('#bTasks').onclick = () => toggleTasks();
$('#tClose').innerHTML = svg('x'); $('#tClose').onclick = () => toggleTasks(false);
$('#bSave').innerHTML = svg('save'); $('#bSave').onclick = () => saveGame(true, true);
$('#bMenu').innerHTML = svg('menu'); $('#bMenu').onclick = menuModal;
$('#face').onclick = () => S && profileModal();
$('#startArt').src = IMG.chibi;
addEventListener('beforeunload', () => { if (running) saveGame(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden && running) saveGame(true); });

// ============ loop ============
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (running) { update(dt); hudTimer += dt; if (hudTimer > 0.2) { hudTimer = 0; updateHUD(); } }
  render(now);
  if (tapFx && running && S) { const a = (now - tapFx.t) / 450; if (a < 1) { cx.setTransform(DPR * zoom, 0, 0, DPR * zoom, -cam.x * DPR * zoom, -cam.y * DPR * zoom); cx.strokeStyle = `rgba(238,138,159,${1 - a})`; cx.lineWidth = 2.5; cx.beginPath(); cx.ellipse(tapFx.x, tapFx.y + 10, 8 + a * 10, 4 + a * 5, 0, 0, 7); cx.stroke(); } else tapFx = null; }
  requestAnimationFrame(frame);
}
buildMaps(); resize(); addEventListener('resize', resize);
showTitle();
if (document.fonts && document.fonts.load) document.fonts.load('600 12px Vazirmatn').catch(() => {});
requestAnimationFrame(frame);

// small test hook
window.NL = { doFloor, ga: guestActions, da: dynActions, get S() { return S; }, get NPCS() { return NPCS; }, P, OBJ, FL, objActions, npcActions, startEntry, update, goFloor, fireEvent, clockIn, endDay, nextDay, taskTarget, goTracked, approach, hitTest, setSpeed };
})();

</script>
